<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">MM58's pixel-art dev station</title>
  <desc id="desc">A blue-armored sci-fi robot gives a thumbs-up beside a floating companion drone and a terminal reading Code. Build. Explore. A dark circuit-board background completes the scene.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#162738" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Static, self-contained artwork: no scripts, fonts, or external images. -->
  <rect width="960" height="320" rx="12" fill="#0b1420"/>
  <rect x="1" y="1" width="958" height="318" rx="11" fill="url(#grid)" stroke="#253d50"/>
  <path d="M24 53H936M24 276H526" fill="none" stroke="#253d50"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace">
    <text x="32" y="34" fill="#a5bacb" font-size="12" letter-spacing="2">MM58 / DEV STATION</text>
    <text x="928" y="34" text-anchor="end" fill="#6ce5c0" font-size="11" letter-spacing="1.5">SYSTEM ONLINE</text>
    <text x="48" y="112" fill="#edf6fc" font-size="38" font-weight="700" letter-spacing="-1">CODE. BUILD.</text>
    <text x="48" y="156" fill="#64d9f4" font-size="38" font-weight="700" letter-spacing="-1">EXPLORE.</text>
    <text x="49" y="188" fill="#95adbf" font-size="12" letter-spacing="1">PYTHON / C++ / JAVASCRIPT / SQL</text>
  </g>

  <!-- Terminal prompt and small hardware indicators. -->
  <path d="M48 209H431V253H48Z" fill="#101f2c" stroke="#2b475b"/>
  <path d="M49 210H52V252H49Z" fill="#64d9f4"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="13">
    <text x="66" y="236" fill="#6ce5c0">&gt;</text>
    <text x="86" y="236" fill="#d3e4ef">software + AI</text>
  </g>
  <rect x="206" y="225" width="8" height="14" fill="#64d9f4"/>
  <g fill="#305066">
    <rect x="374" y="228" width="6" height="6"/>
    <rect x="386" y="228" width="6" height="6"/>
  </g>
  <rect x="398" y="228" width="6" height="6" fill="#6ce5c0"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#809caf">
    <text x="48" y="297">LESS BUSYWORK. MORE BUILDING.</text>
    <text x="927" y="297" text-anchor="end">PLAYER 01 / READY</text>
  </g>

  <!-- Sparse circuit traces, HUD corners, and pixel stars. -->
  <g fill="none" stroke="#26475c" stroke-width="2" shape-rendering="crispEdges">
    <path d="M459 99H490L514 75H566M449 254H496L524 226H578M896 104H924V150H944M906 216H938V254"/>
